<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="100%" height="100%">
  <defs>
    <!-- Soft warm glow on the star -->
    <filter id="star-glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.25" />
    </filter>
  </defs>

  <g transform="translate(10, 0)">
    <!-- Accents / Confetti above star -->
    <line x1="38" y1="42" x2="48" y2="30" stroke="#FBBF24" stroke-width="5" stroke-linecap="round" />
    <line x1="102" y1="42" x2="92" y2="30" stroke="#FBBF24" stroke-width="5" stroke-linecap="round" />

    <!-- Star Symbol -->
    <polygon points="70,36 78,56 100,56 82,69 89,90 70,77 51,90 58,69 40,56 62,56"
             fill="#F59E0B" filter="url(#star-glow-light)" />

    <!-- Nest / Smile Arc Ribbons (layered bottom up) -->
    <!-- Layer 3: Lightest/Bottom base -->
    <path d="M 45 106 C 53 124, 87 124, 95 106" 
          fill="none" stroke="#5B87B5" stroke-width="8" stroke-linecap="round" />
    <!-- Layer 2: Middle mid-tone -->
    <path d="M 36 96 C 46 117, 94 117, 104 96" 
          fill="none" stroke="#2B5B8E" stroke-width="9" stroke-linecap="round" />
    <!-- Layer 1: Top dark navy wing -->
    <path d="M 24 84 C 40 108, 100 108, 116 84" 
          fill="none" stroke="#122A4E" stroke-width="10" stroke-linecap="round" />

    <!-- Brand Typography -->
    <!-- "Future" in Deep Contrast Navy -->
    <text x="145" y="77" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" font-size="44" fill="#0F2444" letter-spacing="-0.5">Future</text>
    
    <!-- "Nest" in Vibrant Warm Amber -->
    <text x="296" y="77" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" font-size="44" fill="#F59E0B" letter-spacing="-0.5">Nest</text>

    <!-- "P L A C E M E N T S" Sub-heading -->
    <text x="147" y="106" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-weight="800" font-size="14" fill="#122A4E" letter-spacing="10">PLACEMENTS</text>

    <!-- Tagline -->
    <text x="147" y="126" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-weight="600" font-size="9" fill="#4B6A90" letter-spacing="4.5">WHERE OPPORTUNITY LANDS</text>
  </g>
</svg>
