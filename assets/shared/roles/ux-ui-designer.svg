<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="ux-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="ux-phone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14315c"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="ux-shadow" x="-8%" y="-10%" width="116%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Main Background Container -->
  <g filter="url(#ux-shadow)">
    <rect x="24" y="20" width="272" height="140" rx="12" fill="url(#ux-card)"/>
    <rect x="24" y="20" width="272" height="140" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.2"/>

    <!-- Left: Mobile Device Wireframe -->
    <rect x="42" y="30" width="84" height="120" rx="14" fill="url(#ux-phone)"/>
    <!-- Phone Notch / Speaker -->
    <rect x="68" y="34" width="32" height="4" rx="2" fill="#334155"/>
    
    <!-- Phone Screen Content -->
    <!-- App Header Banner -->
    <rect x="48" y="44" width="72" height="24" rx="6" fill="#6366f1"/>
    <circle cx="58" cy="56" r="5" fill="#ffffff" opacity="0.3"/>
    <rect x="68" y="52" width="36" height="4" rx="2" fill="#ffffff"/>
    <rect x="68" y="58" width="22" height="3" rx="1.5" fill="#ffffff" opacity="0.7"/>

    <!-- App Card 1 -->
    <rect x="48" y="74" width="72" height="20" rx="5" fill="#1e293b"/>
    <circle cx="58" cy="84" r="4" fill="#10b981"/>
    <rect x="68" y="82" width="42" height="4" rx="2" fill="#94a3b8"/>

    <!-- App Card 2 -->
    <rect x="48" y="98" width="72" height="20" rx="5" fill="#1e293b"/>
    <circle cx="58" cy="108" r="4" fill="#f59e0b"/>
    <rect x="68" y="106" width="38" height="4" rx="2" fill="#94a3b8"/>

    <!-- Bottom Nav Bar -->
    <rect x="48" y="126" width="72" height="14" rx="4" fill="#0f172a"/>
    <circle cx="58" cy="133" r="2.5" fill="#6366f1"/>
    <circle cx="74" cy="133" r="2" fill="#64748b"/>
    <circle cx="90" cy="133" r="2" fill="#64748b"/>
    <circle cx="106" cy="133" r="2" fill="#64748b"/>

    <!-- Right Side: Design Workspace & Tools -->
    <!-- Floating Color Palette -->
    <g transform="translate(142, 34)">
      <rect x="0" y="0" width="138" height="28" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="18" cy="14" r="8" fill="#6366f1"/>
      <circle cx="42" cy="14" r="8" fill="#ec4899"/>
      <circle cx="66" cy="14" r="8" fill="#10b981"/>
      <circle cx="90" cy="14" r="8" fill="#f59e0b"/>
      <circle cx="114" cy="14" r="8" fill="#06b6d4"/>
    </g>

    <!-- Vector Bezier Curve Illustration -->
    <path d="M 148 116 C 165 65, 205 135, 235 85" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Bezier Control Handles -->
    <line x1="165" y1="65" x2="185" y2="90" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
    <rect x="162" y="62" width="6" height="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="185" cy="90" r="3" fill="#6366f1"/>
    <rect x="232" y="82" width="6" height="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>

    <!-- Vector Pen Tool Cursor -->
    <g transform="translate(236, 68)">
      <path d="M 0 16 L 16 0 L 22 6 L 6 22 Z" fill="#14315c"/>
      <path d="M 0 16 L 2 22 L 6 22 Z" fill="#0f172a"/>
      <circle cx="11" cy="11" r="2" fill="#ffffff"/>
      <!-- Cursor Pointer -->
      <polygon points="18,18 28,26 23,27 25,32 22,33 20,28 16,30" fill="#ec4899"/>
    </g>

    <!-- UI Badge -->
    <rect x="142" y="130" width="68" height="20" rx="10" fill="#10b981" fill-opacity="0.15"/>
    <text x="176" y="143" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="9" font-weight="700" fill="#059669" text-anchor="middle">UI / UX DESIGN</text>
  </g>
</svg>

