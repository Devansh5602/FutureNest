<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="ba-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="ba-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14315c"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="ba-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="ba-shadow" x="-8%" y="-10%" width="116%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Main Background Container -->
  <g filter="url(#ba-shadow)">
    <rect x="24" y="20" width="272" height="140" rx="12" fill="url(#ba-bg)"/>
    <rect x="24" y="20" width="272" height="140" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.2"/>

    <!-- Left Side: KPI & Performance Analytics -->
    <!-- KPI Card 1: Performance Gauge -->
    <g transform="translate(42, 34)">
      <rect x="0" y="0" width="118" height="54" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Radial Progress Gauge (arc) -->
      <path d="M 28 42 A 16 16 0 1 1 52 42" fill="none" stroke="#e2e8f0" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M 28 42 A 16 16 0 1 1 49 26" fill="none" stroke="#10b981" stroke-width="4.5" stroke-linecap="round"/>
      <text x="40" y="40" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="800" fill="#14315c" text-anchor="middle">94%</text>

      <text x="68" y="28" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7.5" font-weight="600" fill="#64748b">EFFICIENCY</text>
      <text x="68" y="42" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="800" fill="#059669">+18.2%</text>
    </g>

    <!-- KPI Card 2: Strategy Target & Growth -->
    <g transform="translate(42, 96)">
      <rect x="0" y="0" width="118" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Mini Bar Chart -->
      <rect x="14" y="26" width="8" height="16" rx="2" fill="#cbd5e1"/>
      <rect x="26" y="20" width="8" height="22" rx="2" fill="#94a3b8"/>
      <rect x="38" y="14" width="8" height="28" rx="2" fill="#3b82f6"/>
      <rect x="50" y="8" width="8" height="34" rx="2" fill="#10b981"/>

      <text x="68" y="24" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7.5" font-weight="600" fill="#64748b">KPI GROWTH</text>
      <text x="68" y="38" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="800" fill="#14315c">Optimal</text>
    </g>

    <!-- Right Side: Business Intelligence & Insight Chart -->
    <g transform="translate(172, 34)">
      <rect x="0" y="0" width="112" height="112" rx="10" fill="url(#ba-navy)"/>

      <!-- Dashboard Title -->
      <circle cx="16" cy="18" r="4" fill="#10b981"/>
      <text x="26" y="21" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8.5" font-weight="700" fill="#f8fafc" letter-spacing="0.5">BI DASHBOARD</text>

      <!-- Comparative Analytics Curve -->
      <path d="M 14 84 Q 38 78 54 62 T 98 42" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 14 94 Q 40 90 62 80 T 98 68" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>

      <!-- Data Dots -->
      <circle cx="54" cy="62" r="3.5" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
      <circle cx="98" cy="42" r="4" fill="#34d399"/>

      <!-- Magnifying Glass / Insight Tool -->
      <g transform="translate(62, 54)">
        <circle cx="14" cy="14" r="10" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
        <line x1="22" y1="22" x2="30" y2="30" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
        <circle cx="14" cy="14" r="5" fill="#fbbf24" fill-opacity="0.3"/>
      </g>
    </g>
  </g>
</svg>

