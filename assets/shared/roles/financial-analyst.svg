<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="fa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="fa-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="fa-bar-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="fa-bar-navy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#14315c"/>
    </linearGradient>
    <filter id="fa-shadow" x="-8%" y="-10%" width="116%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Main Card -->
  <g filter="url(#fa-shadow)">
    <rect x="24" y="20" width="272" height="140" rx="12" fill="url(#fa-bg)"/>
    <rect x="24" y="20" width="272" height="140" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.2"/>

    <!-- Chart Grid Lines -->
    <line x1="44" y1="48" x2="276" y2="48" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="44" y1="80" x2="276" y2="80" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="44" y1="112" x2="276" y2="112" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="44" y1="140" x2="276" y2="140" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Ascending Financial Bar Columns -->
    <rect x="52" y="104" width="16" height="36" rx="3" fill="url(#fa-bar-navy)" opacity="0.85"/>
    <rect x="76" y="88" width="16" height="52" rx="3" fill="url(#fa-bar-navy)"/>
    <rect x="100" y="74" width="16" height="66" rx="3" fill="url(#fa-bar-green)" opacity="0.85"/>
    <rect x="124" y="56" width="16" height="84" rx="3" fill="url(#fa-bar-green)"/>

    <!-- Area Chart Gradient Fill -->
    <path d="M 44 116 Q 80 108 116 86 T 188 64 T 276 38 L 276 140 L 44 140 Z" fill="url(#fa-area)"/>

    <!-- Upward Trendline -->
    <path d="M 44 116 Q 80 108 116 86 T 188 64 T 276 38" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>

    <!-- Data Points on Trendline -->
    <circle cx="116" cy="86" r="4" fill="#ffffff" stroke="#059669" stroke-width="2.5"/>
    <circle cx="188" cy="64" r="4" fill="#ffffff" stroke="#059669" stroke-width="2.5"/>
    <circle cx="276" cy="38" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Floating Financial Metric Card -->
  <g transform="translate(182, 74)" filter="url(#fa-shadow)">
    <rect x="0" y="0" width="96" height="56" rx="10" fill="#14315c"/>
    <!-- Currency / Dollar Icon -->
    <circle cx="22" cy="28" r="14" fill="#10b981"/>
    <text x="22" y="34" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">$</text>
    <!-- Growth Metric Text -->
    <text x="44" y="24" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8" font-weight="600" fill="#94a3b8" letter-spacing="0.5">REVENUE</text>
    <text x="44" y="40" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="800" fill="#34d399">+38.5%</text>
  </g>
</svg>

