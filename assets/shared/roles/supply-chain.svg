<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="sc-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="sc-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="sc-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14315c"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="sc-shadow" x="-8%" y="-10%" width="116%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Main Card -->
  <g filter="url(#sc-shadow)">
    <rect x="24" y="20" width="272" height="140" rx="12" fill="url(#sc-card)"/>
    <rect x="24" y="20" width="272" height="140" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.2"/>
    
    <!-- Background Grid Lines & World Network Nodes -->
    <path d="M 46 80 Q 90 45 140 70 T 235 55 T 275 90" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M 50 115 Q 110 90 170 120 T 265 110" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Nodes on Network Route -->
    <circle cx="46" cy="80" r="4.5" fill="#14315c"/>
    <circle cx="46" cy="80" r="8" fill="#14315c" opacity="0.15"/>
    <circle cx="140" cy="70" r="5" fill="#10b981"/>
    <circle cx="140" cy="70" r="9" fill="#10b981" opacity="0.2"/>
    <circle cx="235" cy="55" r="4.5" fill="#14315c"/>
    <circle cx="235" cy="55" r="8" fill="#14315c" opacity="0.15"/>

    <!-- Cargo Containers Stack -->
    <!-- Container 1 (Navy) -->
    <rect x="45" y="102" width="62" height="34" rx="4" fill="url(#sc-navy)"/>
    <line x1="58" y1="105" x2="58" y2="133" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="71" y1="105" x2="71" y2="133" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="84" y1="105" x2="84" y2="133" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="97" y1="105" x2="97" y2="133" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Container 2 (Emerald) -->
    <rect x="113" y="96" width="62" height="40" rx="4" fill="url(#sc-accent)"/>
    <line x1="126" y1="99" x2="126" y2="133" stroke="#a7f3d0" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="139" y1="99" x2="139" y2="133" stroke="#a7f3d0" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="152" y1="99" x2="152" y2="133" stroke="#a7f3d0" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="165" y1="99" x2="165" y2="133" stroke="#a7f3d0" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>

  <!-- Floating Badge: Logistics & Tracking Verified -->
  <g transform="translate(198, 70)" filter="url(#sc-shadow)">
    <rect x="0" y="0" width="78" height="66" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    
    <!-- 3D Delivery Box -->
    <path d="M 39 12 L 58 22 L 39 32 L 20 22 Z" fill="#10b981"/>
    <path d="M 20 22 L 39 32 L 39 52 L 20 42 Z" fill="#059669"/>
    <path d="M 58 22 L 39 32 L 39 52 L 58 42 Z" fill="#047857"/>
    <path d="M 39 32 L 39 44" stroke="#a7f3d0" stroke-width="1.5"/>

    <!-- Checkmark Badge -->
    <circle cx="56" cy="46" r="11" fill="#14315c"/>
    <path d="M 51 46 L 54.5 49.5 L 61 43" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

