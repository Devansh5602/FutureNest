<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#f8fafc"/>
  <!-- Circular Avatar Outline / Frame -->
  <circle cx="400" cy="300" r="210" fill="#e2e8f0"/>
  <g clip-path="url(#avatar-clip)">
    <!-- Head -->
    <circle cx="400" cy="225" r="92" fill="#94a3b8"/>
    <!-- Shoulders / Torso -->
    <path d="M190,520 C190,385 260,350 400,350 C540,350 610,385 610,520 Z" fill="#94a3b8"/>
  </g>
  <defs>
    <clipPath id="avatar-clip">
      <circle cx="400" cy="300" r="210"/>
    </clipPath>
  </defs>
</svg>